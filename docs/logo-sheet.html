<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Rethink Sans'; src: url('../../video/public/fonts/RethinkSans-Medium.ttf'); }
  body { margin: 0; background: #f8faf7; font-family: 'Rethink Sans', sans-serif; color: #20291f; width: 1800px; }
  h1 { font-size: 22px; margin: 28px 40px 8px; font-weight: 500; }
  .row { display: grid; grid-template-columns: 300px 200px 200px 200px 200px 200px 200px; align-items: center; gap: 20px; padding: 18px 40px; border-top: 1px solid #dde5dc; }
  .name { font-size: 20px; line-height: 1.3; }
  .name small { display: block; font-size: 14px; color: #647063; margin-top: 4px; }
  .big svg { width: 160px; height: 160px; }
  .neg { background: #20291f; border-radius: 14px; width: 160px; height: 160px; display: grid; place-items: center; }
  .neg svg { width: 110px; height: 110px; }
  .app { width: 160px; height: 160px; background: #a0e099; border-radius: 36px; display: grid; place-items: center; }
  .app svg { width: 96px; height: 96px; }
  .avatar { width: 120px; height: 120px; background: #20291f; border-radius: 999px; display: grid; place-items: center; }
  .avatar svg { width: 72px; height: 72px; }
  .small { display: flex; gap: 22px; align-items: center; }
  .small svg { display: block; }
  .tab { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #dde5dc; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .tab svg { width: 16px; height: 16px; }
</style>
<body>
<h1>DailyRecap · isotipo: cinco direcciones en vector (grilla 24). Negro puro primero; el verde es fondo.</h1>
<script>
const INK = '#20291f', LIGHT = '#fdfffc';
const MARKS = {
  A: { name: 'A · La porción', sub: 'un minuto sacado del día: disco + cuña desprendida', svg: (c) => `
    <svg viewBox="0 0 24 24"><path fill="${c}" d="M12 12 L12 3 A9 9 0 1 0 18.36 5.64 Z"/>
    <path fill="${c}" d="M12.96 9.69 L12.96 0.69 A9 9 0 0 1 19.32 3.33 Z"/></svg>` },
  B: { name: 'B · La bóveda', sub: 'el día que se cierra: sol que se pone + horizonte', svg: (c) => `
    <svg viewBox="0 0 24 24"><path fill="${c}" d="M1.5 17a10.5 10.5 0 0 1 21 0z"/>
    <rect fill="${c}" x="0" y="20" width="24" height="3" rx="1.5"/></svg>` },
  C: { name: 'C · El punto final', sub: '«the period at the end of a sentence»: barra + punto', svg: (c) => `
    <svg viewBox="0 0 24 24"><rect fill="${c}" x="1" y="10" width="12" height="4" rx="2"/>
    <circle fill="${c}" cx="18" cy="12" r="5"/></svg>` },
  D: { name: 'D · El bloque con el minuto', sub: 'el día como bloque; la pieza que se entrega', svg: (c) => `
    <svg viewBox="0 0 24 24"><path fill="${c}" d="M5 4h9v6h6v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
    <rect fill="${c}" x="17" y="1" width="6" height="6" rx="1.5"/></svg>` },
  E: { name: 'E · La D como forma', sub: 'la vuelta del día y la línea de entrega', svg: (c) => `
    <svg viewBox="0 0 24 24"><rect fill="${c}" x="1" y="1" width="5" height="22" rx="1.5"/>
    <path fill="${c}" d="M11 1a11 11 0 0 1 0 22v-5a6 6 0 0 0 0-12z"/></svg>` },
};
for (const [k, m] of Object.entries(MARKS)) {
  document.body.insertAdjacentHTML('beforeend', `
  <div class="row">
    <div class="name">${m.name}<small>${m.sub}</small></div>
    <div class="big">${m.svg(INK)}</div>
    <div class="neg">${m.svg(LIGHT)}</div>
    <div class="app">${m.svg(INK)}</div>
    <div class="avatar">${m.svg(LIGHT)}</div>
    <div class="small">
      <span style="width:48px;height:48px">${m.svg(INK).replace('<svg', '<svg width="48" height="48"')}</span>
      <span style="width:24px;height:24px">${m.svg(INK).replace('<svg', '<svg width="24" height="24"')}</span>
      <span class="tab">${m.svg(INK)} DailyRecap</span>
    </div>
  </div>`);
}
</script>
</body>
</html>
